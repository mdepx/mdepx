modules fw_if hw_if;

append-cflags -D__KERNEL__;

append-search-path .;
append-search-path
		hw_if/hal/inc;
		hw_if/hal/inc/fw;
append-search-path
		fw_if/umac_if/inc/system
		fw_if/umac_if/inc/fw
		fw_if/umac_if/inc;
append-search-path
		os_if/inc
		bus_if/bal/inc
		bus_if/bus/qspi/inc
		utils/inc;

append-cflags -Wno-unused-but-set-variable;
append-cflags -Wno-missing-prototypes;
append-cflags -Wno-pointer-sign;
append-cflags -Wno-cast-qual;
append-cflags -Wno-int-conversion;
append-cflags -Wno-incompatible-pointer-types;
append-cflags -include ../../src/wifi/config.h;

fw_if {
